<style>
:root{
  --bg:#0c0b09;--bg-2:#15130f;--bg-3:#1d1a15;--ink:#f4f1ea;--ink-2:#d8d3c8;
  --muted:#8f897e;--line:rgba(244,241,234,.12);--line-2:rgba(244,241,234,.20);
  --accent:#c98a5a;--accent-2:#a85a32;
  --serif:'Fraunces','Vazirmatn',serif;--sans:'Vazirmatn',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

/* Nav */
.nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 40px;background:rgba(12,11,9,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .brand{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink);text-decoration:none}
.nav .brand b{font-style:normal;font-weight:500}
.nav ul{display:flex;gap:22px;list-style:none;align-items:center}
.nav a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
.nav a:hover,.nav a.active{color:var(--ink)}
.lang-toggle{background:transparent;border:1px solid var(--line-2);color:var(--ink);padding:5px 12px;border-radius:20px;font-family:var(--sans);font-size:12px;cursor:pointer;transition:all .25s}

/* Cover */
.post-cover{width:100%;max-height:480px;object-fit:cover;display:block}
.post-cover-ph{width:100%;height:280px;background:linear-gradient(135deg,#1a1410,#a85a32)}

/* Article */
.post-wrap{max-width:780px;margin:0 auto;padding:48px 40px 80px}
.post-back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:36px;transition:color .2s}
.post-back:hover{color:var(--accent)}
.post-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.post-cat{font-size:10px;letter-spacing:2px;color:var(--accent);border:1px solid var(--line-2);padding:3px 10px;border-radius:20px}
.post-date{font-size:12px;color:var(--muted)}
.post-readtime{font-size:12px;color:var(--muted)}
.post-views{font-size:12px;color:var(--muted);margin-right:auto}
.post-title{font-family:var(--serif);font-weight:300;font-size:clamp(28px,5vw,52px);line-height:1.15;letter-spacing:-.02em;margin-bottom:20px}
.post-excerpt{font-size:18px;color:var(--muted);line-height:1.8;margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid var(--line)}

/* Video */
.post-video{margin:0 0 36px;border-radius:6px;overflow:hidden}
.post-video iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.post-video video{width:100%;border-radius:6px;display:block}

/* Content */
.post-content{font-size:17px;line-height:2;color:var(--ink-2)}
.post-content h2{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--ink);margin:40px 0 16px;letter-spacing:-.01em}
.post-content h3{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);margin:32px 0 12px}
.post-content p{margin-bottom:20px}
.post-content img{max-width:100%;border-radius:6px;margin:20px 0}
.post-content blockquote{border-right:3px solid var(--accent);padding:16px 20px;margin:24px 0;background:var(--bg-2);border-radius:0 6px 6px 0;font-style:italic;color:var(--muted)}
.post-content ul,.post-content ol{padding-right:24px;margin-bottom:20px}
.post-content li{margin-bottom:8px;line-height:1.8}
.post-content a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(201,138,90,.3)}
.post-content a:hover{border-color:var(--accent)}
.post-content code{background:var(--bg-3);padding:2px 8px;border-radius:4px;font-size:14px;direction:ltr;display:inline-block}
.post-content pre{background:var(--bg-3);padding:20px;border-radius:6px;overflow-x:auto;margin:20px 0;direction:ltr}
.post-content strong{color:var(--ink);font-weight:600}

/* Share */
.post-share{margin-top:48px;padding-top:32px;border-top:1px solid var(--line)}
.post-share h3{font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:16px}
.share-btns{display:flex;gap:10px;flex-wrap:wrap}
.share-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:4px;font-size:13px;text-decoration:none;font-family:var(--sans);transition:all .25s;border:1px solid var(--line-2);color:var(--ink)}
.share-btn:hover{background:var(--accent);border-color:var(--accent);color:#0a0a0a}

/* VPN notice */
.vpn-notice{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:6px;font-size:13px;margin-top:10px;line-height:1.6}
.vpn-notice.off{background:rgba(26,107,212,.12);border:1px solid rgba(26,107,212,.3);color:#6ab0ff}
.vpn-notice.on{background:rgba(224,0,0,.1);border:1px solid rgba(224,0,0,.25);color:#ff8080}

/* Comments */
.comments-section{margin-top:60px;padding-top:48px;border-top:1px solid var(--line)}
.comments-section h2{font-family:var(--serif);font-weight:300;font-size:28px;margin-bottom:8px}
.comments-section .sub{color:var(--muted);font-size:14px;margin-bottom:36px}
.comment-list{display:flex;flex-direction:column;gap:20px;margin-bottom:48px}
.comment{background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:20px}
.comment-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.comment-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;color:#0a0a0a;flex-shrink:0}
.comment-name{font-weight:500;font-size:14px}
.comment-date{font-size:11px;color:var(--muted)}
.comment p{font-size:14px;line-height:1.8;color:var(--ink-2)}
.no-comments{text-align:center;padding:40px;color:var(--muted);font-style:italic;font-family:var(--serif)}

/* Comment Form */
.comment-form h3{font-family:var(--serif);font-weight:400;font-size:22px;margin-bottom:24px}
.cf-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.cf-field label{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.cf-field input,.cf-field textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);padding:12px;color:var(--ink);font-family:var(--sans);font-size:14px;border-radius:4px;outline:none;transition:border .25s}
.cf-field input:focus,.cf-field textarea:focus{border-color:var(--accent)}
.cf-field textarea{min-height:100px;resize:vertical}
.cf-submit{margin-top:16px;background:var(--accent);color:#0a0a0a;border:none;padding:14px 32px;font-family:var(--sans);font-size:13px;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:background .3s}
.cf-submit:hover{background:var(--accent-2);color:#fff}
.cf-submit:disabled{opacity:.5;cursor:not-allowed}
.cf-msg{margin-top:14px;padding:12px 16px;border-radius:4px;font-size:13px;display:none}
.cf-msg.ok{background:rgba(126,199,126,.12);border:1px solid #7ec77e;color:#7ec77e;display:block}
.cf-msg.err{background:rgba(224,122,106,.12);border:1px solid #e07a6a;color:#e07a6a;display:block}

/* Loading */
.post-loading{max-width:780px;margin:80px auto;padding:40px;text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic}
.spinner{width:32px;height:32px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
footer{background:#080807;border-top:1px solid var(--line);padding:28px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
footer .copy{font-size:12px;color:var(--muted);letter-spacing:1px}
footer .links{display:flex;gap:16px}
footer .links a{font-size:12px;color:var(--muted);text-decoration:none;transition:color .2s}
footer .links a:hover{color:var(--accent)}

@media (max-width:700px){
  .nav{padding:16px 20px}
  .post-wrap{padding:32px 20px 60px}
  .cf-grid{grid-template-columns:1fr}
  .post-title{font-size:28px}
  footer{padding:20px}
}
</style>

<body>

<header class="nav">
  <a href="/" class="brand">Mehdi <b>Mehrabi</b></a>
  <ul>
    <li><a href="/#home">خانه</a></li>
    <li><a href="/#courses">دوره‌ها</a></li>
    <li><a href="/blog" class="active">بلاگ</a></li>
    <li><a href="/#contact">تماس</a></li>
    <li><button id="langToggle" class="lang-toggle">EN</button></li>
  </ul>
</header>

<div id="postLoading" class="post-loading">
  <div class="spinner"></div>
  در حال بارگذاری…
</div>

<div id="postMain" style="display:none">
  <img id="postCover" class="post-cover" style="display:none"/>
  <div id="postCoverPh" class="post-cover-ph" style="display:none"></div>

  <div class="post-wrap">
    <a href="/blog" class="post-back" id="backBtn">← بازگشت به بلاگ</a>

    <div class="post-meta">
      <span class="post-cat" id="postCat"></span>
      <span class="post-date" id="postDate"></span>
      <span class="post-readtime" id="postReadtime"></span>
      <span class="post-views" id="postViews"></span>
    </div>

    <h1 class="post-title" id="postTitle"></h1>
    <p class="post-excerpt" id="postExcerpt"></p>

    <!-- ویدیو -->
    <div class="post-video" id="postVideo" style="display:none"></div>

    <!-- محتوا -->
    <div class="post-content" id="postContent"></div>

    <!-- اشتراک‌گذاری -->
    <div class="post-share">
      <h3 id="shareTitle">اشتراک‌گذاری</h3>
      <div class="share-btns" id="shareBtns"></div>
    </div>

    <!-- کامنت‌ها -->
    <div class="comments-section">
      <h2 id="commentsTitle">نظرات</h2>
      <p class="sub" id="commentsSub">نظرات بعد از تأیید نمایش داده می‌شوند.</p>
      <div class="comment-list" id="commentList"></div>

      <div class="comment-form">
        <h3 id="commentFormTitle">نظر بگذار</h3>
        <div class="cf-grid">
          <div class="cf-field"><label id="cfNameLabel">نام</label><input id="cfName" required/></div>
          <div class="cf-field"><label id="cfEmailLabel">ایمیل (اختیاری)</label><input id="cfEmail" type="email"/></div>
        </div>
        <div class="cf-field"><label id="cfMsgLabel">نظر شما</label><textarea id="cfMsg" required></textarea></div>
        <button class="cf-submit" id="cfSubmit">ثبت نظر</button>
        <div class="cf-msg" id="cfMsg2"></div>
      </div>
    </div>
  </div>
</div>

<div id="postError" style="display:none;max-width:500px;margin:100px auto;text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:18px">مقاله پیدا نشد.</div>

<div style="text-align:center;padding:20px 0"><a referrerpolicy="origin" target="_blank" href="https://trustseal.enamad.ir/?id=7437957&Code=jLmdD0lCLV7eeJKo1o59E3HJZKipaqOj"><img referrerpolicy="origin" src="https://trustseal.enamad.ir/logo.aspx?id=7437957&Code=jLmdD0lCLV7eeJKo1o59E3HJZKipaqOj" alt="نماد اعتماد" style="cursor:pointer;max-width:100px;background:#fff;border-radius:6px;padding:6px" code="jLmdD0lCLV7eeJKo1o59E3HJZKipaqOj"></a></div><footer>
  <div class="copy">© ۱۴۰۴ آکادمی هوش مصنوعی مهدی محرابی</div>
  <div class="links">
    <a href="https://instagram.com/Filmehdy" target="_blank">Instagram</a>
    <a href="https://wa.me/989170073010" target="_blank">WhatsApp</a>
  </div>
</footer>

<script>
let currentLang = localStorage.getItem('mm_lang')||'fa';
let postId = null;

document.getElementById('langToggle').addEventListener('click',()=>{
  currentLang = currentLang==='fa'?'en':'fa';
  localStorage.setItem('mm_lang',currentLang);
  document.getElementById('langToggle').textContent = currentLang==='fa'?'EN':'فا';
  location.reload();
});
document.getElementById('langToggle').textContent = currentLang==='fa'?'EN':'فا';
document.documentElement.lang=currentLang;
document.documentElement.dir=currentLang==='fa'?'rtl':'ltr';

// slug را هم از query string و هم از مسیر /p/xxx می‌خوانیم
let slug = new URLSearchParams(location.search).get('slug');
if (!slug) {
  const pathMatch = location.pathname.match(/\/p\/([A-Za-z0-9_-]+)/);
  if (pathMatch) slug = pathMatch[1];
}

async function loadPost(){
  if(!slug){ showError(); return; }
  const {data,error}=await sb.from('posts').select('*').eq('slug',slug).eq('is_published',true).single();
  if(error||!data){ showError(); return; }
  postId=data.id;

  const EN=currentLang==='en';
  const pick=(f)=>(EN&&data[f+'_en'])?data[f+'_en']:data[f];

  // Page meta
  const title=pick('title')||'';
  const excerpt=pick('excerpt')||'';
  document.title=title+' | مهدی محرابی';
  document.getElementById('pageTitle').textContent=title+' | مهدی محرابی';
  document.getElementById('pageDesc').content=excerpt;
  const canon=document.getElementById('canonicalLink');
  if(canon) canon.href='https://mehdimehrabi.ir/p/'+slug;

  // Cover
  if(data.cover_url){
    const img=document.getElementById('postCover');
    img.src=data.cover_url; img.alt=title; img.style.display='block';
  } else {
    document.getElementById('postCoverPh').style.display='block';
  }

  // Meta
  document.getElementById('postCat').textContent=pick('category')||'';
  document.getElementById('postDate').textContent=new Date(data.created_at).toLocaleDateString(EN?'en-US':'fa-IR',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('postReadtime').textContent=(EN?`${data.read_time||5} min read`:`${data.read_time||5} دقیقه مطالعه`);
  document.getElementById('postViews').textContent='👁 '+(data.views||0).toLocaleString(EN?'en':'fa-IR');

  // Title & excerpt
  document.getElementById('postTitle').textContent=title;
  document.getElementById('postExcerpt').textContent=excerpt;

  // Video
  if(data.video_url){
    const vd=document.getElementById('postVideo');
    vd.style.display='block';
    const url=data.video_url;

    function aparatHash(u){ const m=u.match(/aparat\.com\/v\/([a-zA-Z0-9]+)/); return m?m[1]:null; }
    function ytId(u){ const m=u.match(/[?&]v=([a-zA-Z0-9_-]+)/)||u.match(/youtu\.be\/([a-zA-Z0-9_-]+)/); return m?m[1]:null; }

    const EN=currentLang==='en';
    let videoHtml='', noticeHtml='';

    if(url.includes('aparat.com')){
      const hash=aparatHash(url);
      if(hash){
        videoHtml=`<iframe src="https://www.aparat.com/video/video/embed/videohash/${hash}/vt/frame" allowfullscreen loading="lazy" style="width:100%;aspect-ratio:16/9;border:none;display:block;border-radius:6px"></iframe>`;
        noticeHtml=`<div class="vpn-notice off">🔵 ${EN?'To watch this video, please turn OFF your VPN.':'برای دیدن این ویدیو، فیلترشکن خود را <strong>خاموش</strong> کنید.'}</div>`;
      }
    } else if(url.includes('youtube.com')||url.includes('youtu.be')){
      const id=ytId(url);
      if(id){
        videoHtml=`<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy" style="width:100%;aspect-ratio:16/9;border:none;display:block;border-radius:6px"></iframe>`;
        noticeHtml=`<div class="vpn-notice on">🔴 ${EN?'To watch this video, please turn ON your VPN.':'برای دیدن این ویدیو، فیلترشکن خود را <strong>روشن</strong> کنید.'}</div>`;
      }
    } else {
      videoHtml=`<video src="${url}" controls playsinline style="width:100%;border-radius:6px;display:block"></video>`;
    }
    vd.innerHTML=videoHtml+noticeHtml;
  }

  // Content
  document.getElementById('postContent').innerHTML=pick('content')||'';

  // Share
  const url=encodeURIComponent(location.href);
  const t=encodeURIComponent(title);
  document.getElementById('shareBtns').innerHTML=`
    <a class="share-btn" href="https://wa.me/?text=${t}%20${url}" target="_blank">واتساپ</a>
    <a class="share-btn" href="https://t.me/share/url?url=${url}&text=${t}" target="_blank">تلگرام</a>
    <a class="share-btn" href="#" onclick="navigator.clipboard.writeText(location.href);this.textContent='✓ کپی شد';return false">${EN?'Copy link':'کپی لینک'}</a>
  `;
  if(EN){
    document.getElementById('shareTitle').textContent='Share';
    document.getElementById('commentsTitle').textContent='Comments';
    document.getElementById('commentsSub').textContent='Comments are shown after approval.';
    document.getElementById('commentFormTitle').textContent='Leave a comment';
    document.getElementById('cfNameLabel').textContent='Name';
    document.getElementById('cfEmailLabel').textContent='Email (optional)';
    document.getElementById('cfMsgLabel').textContent='Your comment';
    document.getElementById('cfSubmit').textContent='Submit comment';
    document.getElementById('backBtn').textContent='← Back to Blog';
  }

  // Show
  document.getElementById('postLoading').style.display='none';
  document.getElementById('postMain').style.display='block';

  // Increment views
  await sb.rpc('increment_post_views',{post_slug:slug}).catch(()=>{});

  // Load comments
  loadComments();
}

async function loadComments(){
  const {data}=await sb.from('comments').select('name,content,created_at').eq('post_id',postId).eq('is_approved',true).order('created_at',{ascending:true});
  const list=document.getElementById('commentList');
  if(!data||data.length===0){
    list.innerHTML=`<div class="no-comments">${currentLang==='en'?'No comments yet. Be the first!':'هنوز نظری ثبت نشده. اول باش!'}</div>`;
    return;
  }
  list.innerHTML=data.map(c=>`<div class="comment">
    <div class="comment-head">
      <div class="comment-avatar">${(c.name||'ن')[0]}</div>
      <div><div class="comment-name">${c.name}</div>
      <div class="comment-date">${new Date(c.created_at).toLocaleDateString(currentLang==='en'?'en-US':'fa-IR',{year:'numeric',month:'long',day:'numeric'})}</div></div>
    </div>
    <p>${c.content.replace(/</g,'&lt;')}</p>
  </div>`).join('');
}

// Submit comment
document.getElementById('cfSubmit').addEventListener('click',async()=>{
  const name=document.getElementById('cfName').value.trim();
  const email=document.getElementById('cfEmail').value.trim();
  const content=document.getElementById('cfMsg').value.trim();
  const msg=document.getElementById('cfMsg2');
  const EN=currentLang==='en';
  if(!name||!content){ msg.className='cf-msg err'; msg.textContent=EN?'Please fill in the required fields.':'نام و نظر الزامی است.'; return; }
  const btn=document.getElementById('cfSubmit'); btn.disabled=true;
  const {error}=await sb.from('comments').insert([{post_id:postId,name,email:email||null,content}]);
  btn.disabled=false;
  if(error){ msg.className='cf-msg err'; msg.textContent=EN?'Error submitting comment.':'خطا در ثبت نظر.'; return; }
  msg.className='cf-msg ok';
  msg.textContent=EN?'Comment submitted! It will appear after approval.':'نظرت ثبت شد! بعد از تأیید نمایش داده می‌شه.';
  document.getElementById('cfName').value='';
  document.getElementById('cfEmail').value='';
  document.getElementById('cfMsg').value='';
});

function showError(){ document.getElementById('postLoading').style.display='none'; document.getElementById('postError').style.display='block'; }

loadPost();
</script>
</body>
</html>
